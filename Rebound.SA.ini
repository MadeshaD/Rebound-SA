; Rebound.SA 0.61 | GTA San Andreas
; Switches use 0 (off) or 1 (on). Save edits and press F8 to reload.
; EQ gains use whole decibels. A gain of 0 leaves the band neutral.

[General]
; Write Rebound.SA.log beside the ASI. 0 = off, 1 = on. Apply with F8.
; Enabling starts a new log. Status is recorded every 5 seconds.
Logging=0
; Load the plugin at game startup. Restart after changing this switch.
Enabled=1
; Process sounds in separate game interiors. Stadiums (stadint) are always processed.
Interiors=0

[Controls]
; Reload this file in game. Use a decimal Windows virtual-key code (119 = F8).
ReloadKey=119

[Effects]
; Enable early echoes from walls, entrances and covered spaces.
Echo=1
; Enable the late reverberation tail and its low-frequency rumble.
Reverb=1

[LowHealth]
; Apply injury audio during gameplay. The pause menu and game cutscenes are excluded.
; Filters the final mix, including radio music, mission dialogue, HUD and environmental echoes.
Enabled=1
; Start at this percentage of CJ's current maximum health, 10-50. Armour is ignored.
ThresholdPercent=15
; Strength of muffling, low Steam Audio reverb and ear ringing, 0-100%. 0 disables all three.
; Greater injury makes the bass return louder and longer. Recognized CJ lines bypass this effect.
StrengthPercent=100

[Levels]
; Overall level of both effects, 0-150%.
WetPercent=100
; Reflection level for recognized speech, including CJ, 0-100%.
SpeechWetPercent=35
; Extra reduction for quiet sounds, 0-48 dB. Higher values make their reflections quieter.
QuietContrastDb=18
; Extra late reverb between tall outdoor facades, 0-12 dB.
StreetBoostDb=12
; Extra reflection gain in tunnels, 0-18 dB. The source position affects the boost.
TunnelBoostDb=12
; Maximum reflection boost for distant sources, 0-24 dB.
DistantBoostDb=24

[Echo]
; Additional delay for early echoes, 0-250 ms.
DelayMs=0
; Scale early reflection travel times, 25-300%. Use 100 for measured timing.
StretchPercent=100

[EchoEQ]
; Low frequencies below about 500 Hz, -18 to +12 dB.
LowDb=0
; Middle frequencies between about 500 and 3500 Hz, -18 to +12 dB.
MidDb=0
; High frequencies above about 3500 Hz, -18 to +12 dB.
HighDb=-6

[Reverb]
; Additional delay before the late tail, 0-250 ms.
PreDelayMs=0
; Scale the estimated decay time for the current space, 25-250%.
DecayPercent=100
; Scale low-frequency decay in the Steam Audio tail, 50-200%.
LowDecayPercent=100
; Scale high-frequency decay in the Steam Audio tail, 50-200%.
HighDecayPercent=100

[ReverbEQ]
; Low frequencies below about 500 Hz, -18 to +12 dB.
LowDb=-6
; Middle frequencies between about 500 and 3500 Hz, -18 to +12 dB.
MidDb=0
; High frequencies above about 3500 Hz, -18 to +12 dB.
HighDb=0

[Propagation]
; Apply obstacle transmission and routing to the direct sound.
DirectOcclusion=1
; Search radius for nearby walls and ceilings, 40-200 game units.
RoomProbeRadius=120
; Range for detailed processing of active sources, 50-600 game units.
SourceRadius=400

[Spatial]
; Audible range of world sounds, 100-300% of the original game range.
WorldSoundRangePercent=200
; Range of positional pedestrian speech, 25-300% of its original range.
PedSpeechRangePercent=100
; Request headphone spatialization. DirectSound applies it to newly created positional buffers.
Headphones=1
; Mix directional reflections using first-order Ambisonics.
Ambisonics=1
; Ambisonics range, 25-600 game units. The effect fades over the outer 30%.
AmbisonicsRadius=240

[Underwater]
; Enable underwater filtering, including vehicle radio while submerged.
Enabled=1
; Additional underwater volume loss, 0-36 dB. At 0, the tone filter still applies.
AttenuationDb=0
; Underwater filter frequency, 100-3000 Hz. Lower values produce a darker sound.
CutoffHz=420
; Filter modulation depth, 0-35%. Use 0 for a steady filter.
ModulationPercent=12
